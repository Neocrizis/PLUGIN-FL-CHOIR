name: Build Mac

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Les seuils de niveau n'ont pas encore ete valides sur un vrai rendu :
      # un echec est visible dans le journal mais ne bloque pas le plugin.
      - name: Tester le moteur
        continue-on-error: true
        run: |
          clang++ -std=c++17 -O2 tests/render_test.cpp -o render_test
          status=0
          ./render_test . > test.txt || status=$?
          # GitHub limite les annotations a 10 par etape : on garde les dernieres lignes.
          grep -v '^$' test.txt | tail -n 10 | while IFS= read -r line; do
            echo "::notice title=Test::$line"
          done
          exit $status

      - name: Compiler
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target Chorale_VST3 Chorale_AU

      - name: Preparer le paquet
        run: |
          mkdir -p package
          cp -R build/Chorale_artefacts/Release/VST3/Chorale.vst3 package/
          cp -R build/Chorale_artefacts/Release/AU/Chorale.component package/
          codesign --force --deep -s - package/Chorale.vst3
          codesign --force --deep -s - package/Chorale.component
          cp INSTALLATION-MAC.txt package/
          mv package Ensemble
          ditto -c -k --keepParent Ensemble Ensemble.zip

      # Lien direct et stable, sans compte GitHub.
      - name: Publier le paquet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "Chorale - version de test" --notes "Version de test pour Mac." --prerelease
          gh release upload latest Ensemble.zip --clobber

      - name: Publier l'exemple audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Exemple-audio
          path: choeur.wav
          if-no-files-found: warn
